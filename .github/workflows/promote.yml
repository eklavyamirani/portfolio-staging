name: Promote to github.ekkylab.uk

# Copies this repo into the user-site repo and opens (or refreshes) a pull
# request there. Nothing reaches the live site until that PR is merged.
#
# Needs a fine-grained token in the PROMOTE_TOKEN secret, scoped to
# eklavyamirani/eklavyamirani.github.com only, with
# Contents: read & write and Pull requests: read & write.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Branch in the user-site repo to open the PR against
        default: master

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

env:
  TARGET_REPO: eklavyamirani/eklavyamirani.github.com
  PROMOTE_BRANCH: promote/staging

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: staging

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: staging/package-lock.json

      - name: Verify before promoting
        working-directory: staging
        run: |
          npm ci
          npm test
          npm run check
          npm run build

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ inputs.base }}
          token: ${{ secrets.PROMOTE_TOKEN }}
          path: target

      - name: Copy staging into the target
        run: |
          # Mirror the staging tree, but keep the target's git data and
          # custom-domain file, and leave out staging-only and generated files.
          rsync -a --delete \
            --exclude .git/ \
            --exclude CNAME \
            --exclude node_modules/ \
            --exclude dist/ \
            --exclude .astro/ \
            --exclude .github/workflows/promote.yml \
            staging/ target/

      - name: Commit and open the pull request
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          BASE: ${{ inputs.base }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          git switch -c "$PROMOTE_BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "The target already matches staging. Nothing to promote." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Promote portfolio-staging@${SOURCE_SHA::7}" -m "Source: $SOURCE_URL"
          git push --force origin "$PROMOTE_BRANCH"

          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Promotes [portfolio-staging@${SOURCE_SHA::7}]($SOURCE_URL) to the live site.

          The tests, type check and build passed in staging before this PR was opened. They run again here.

          Merging this replaces the contents of \`$BASE\`. Before you merge:

          - [ ] Preview the staging site: https://github.ekkylab.uk/portfolio-staging/
          - [ ] In this repo's **Settings → Pages**, set **Source** to **GitHub Actions**. This is only needed the first time. Until then Pages keeps serving \`$BASE\` as plain files.
          - [ ] Check that the custom domain is still \`github.ekkylab.uk\`

          The previous site is archived on \`archive/legacy-blog\`.
          EOF

          if gh pr view "$PROMOTE_BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$PROMOTE_BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated the open promotion PR." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base "$BASE" --head "$PROMOTE_BRANCH" \
              --title "Promote portfolio from staging" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
          gh pr view "$PROMOTE_BRANCH" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
